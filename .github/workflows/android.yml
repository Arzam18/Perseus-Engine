name: Build Perseus Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'makefile'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Perseus Android ARM64 NEON
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build Android ARM64 executable
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          test -x "$CXX"
          make -C src clean
          make -C src release \
            CXX="$CXX" \
            CPU=armv8-a+simd \
            CXXFLAGS_EXTRA='-fno-exceptions -DNDEBUG -O3 -flto' \
            LDFLAGS_EXTRA='-static-libstdc++ -Wl,--gc-sections'
          mkdir -p dist
          cp src/Perseus dist/Perseus-android-arm64
          chmod 755 dist/Perseus-android-arm64
          echo '=== Verify architecture ==='
          file dist/Perseus-android-arm64
          readelf -h dist/Perseus-android-arm64 | grep -E 'Class:|Machine:'
          readelf -l dist/Perseus-android-arm64 | grep -E 'INTERP|Requesting program interpreter' || true
          echo '=== Verify dynamic dependencies ==='
          readelf -d dist/Perseus-android-arm64 | grep NEEDED || true
          readelf -h dist/Perseus-android-arm64 | grep -q 'AArch64' || { echo 'ERROR: output is not AArch64'; exit 1; }
          if readelf -l dist/Perseus-android-arm64 | grep -q 'Requesting program interpreter.*ld-linux'; then
            echo 'ERROR: output uses a GNU/Linux dynamic linker'; exit 1
          fi

      - name: Upload Android ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: Perseus-android-arm64-neon
          path: dist/Perseus-android-arm64
          if-no-files-found: error
